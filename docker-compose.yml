name: DRF_API_Query

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
  
  django:
    build: .  # Refer to next to .yml file
    container_name: django_app
    restart: always
    depends_on: # don't start django unless db exists
      - postgres  # service name
    volumes:
      - ./app:/app  # ./app next to yml map to /app inside container
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py runserver 0.0.0.0:8000
      "
